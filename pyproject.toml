[project]
name = "dialect-coaching"
version = "0.1.0"
description = "Accent-aware phonetic transcription from audio using IPA"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2.0,<2.4.0",
    "transformers>=4.38.0,<5.0.0",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "numpy<2.0",
    "phonemizer>=3.0.0",
    "protobuf>=4.0.0",
    "safetensors>=0.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pydub>=0.25.0",
]

[project.scripts]
dialect-coaching = "dialect_coaching.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialect_coaching"]
